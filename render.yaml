services:
  - type: web
    name: sellerboost-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: backboard
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_BASE_URL
        value: https://app.backboard.io/api
      - key: BACKBOARD_DEFAULT_PROVIDER
        value: openrouter
      - key: BACKBOARD_DEFAULT_MODEL
        value: meta-llama/llama-3.1-8b-instruct
      - key: BACKBOARD_MULTILINGUAL_MODEL
        value: qwen/qwen-2.5-72b-instruct
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: ^https:\/\/.*\.vercel\.app$
      - key: DEBUG
        value: false
